    body {

        color: rgb(0, 0, 0);
        margin: 0;

        /* CENTRER verticalement et horizontalement sur PC */
        display: flex;

        justify-content: center;
        align-items: center;
        text-align: center;
    }

    .episode-block a {
        display: block;
        width: 100%;
        height: 100%;
        color: white;
        text-decoration: none;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .episode-block:hover {
        background-color: rgba(68,68,68,0.8);
    }

    /* === Responsive mobile === */
    @media (max-width: 600px) {
        body {
            min-height: auto; /* laisse le contenu défiler normalement */
        }

        h1 {
            font-size: 2em;
        }

        .episodes-container {
            flex-direction: column; /* empile verticalement */
            gap: 15px;
        }

        .episode-block {
            width: 80%; /* prend la largeur de l’écran */
            height: auto; /* s’adapte au texte */
            padding: 15px;
            font-size: 1em;
        }
    }
</style>
