<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alien - The Last Dance</title>
    <style>
        /* === Style de base === */
        body {
            font-family: "Abel Static", sans-serif;
            background-image: url("Autres/Reina.png"); /* ton fond actuel */
            background-size: cover;
            background-position: top center;
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        /* Logo */
        img {
            max-width: 300px; /* taille PC */
            height: auto;
            display: block;
            margin: 50px auto 20px auto;
        }

        h1 {
            font-size: 3em;
            margin: 20px 0;
        }

        /* Blocs de saison */
        .season-block {
            background-color: rgba(34,34,34,0.8);
            margin: 20px auto;
            padding: 20px;
            width: 200px;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .season-block:hover {
            background-color: rgba(68,68,68,0.8);
        }

        a { color: white; text-decoration: none; }

        /* === Responsive mobile === */
        @media (max-width: 600px) {
            img {
                max-width: 80%; /* réduit logo et toutes les images */
                margin: 20px auto;
            }

            h1 {
                font-size: 1.8em; /* texte plus petit */
            }

            .season-block {
                width: 80%;       /* bloc s’adapte à l’écran */
                padding: 15px;
                font-size: 1em;
                margin: 10px auto;
            }
        }
    </style>
</head>
<body>

    <!-- Logo -->
    <img src="Autre/logo.png" alt="Logo Alien">

    <!-- Titre -->
    <h1>Alien - The Last Dance</h1>

    <!-- Bloc Saison -->
    <a href="season1.html">
        <div class="season-block">Saison 1</div>
    </a>

</body>
</html>
