<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>2┆🔵・𝘈𝘭𝘭𝘦𝘳 𝘴𝘢𝘯𝘴 𝘳𝘦𝘵𝘰𝘶𝘳</title>

    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 40px;
            background-color: #f0f0f0;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 30px;
        }

        img {
            max-width: 95%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .buttons {
            margin-top: 25px;
        }

        button {
            font-size: 20px;
            padding: 12px 25px;
            margin: 0 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
        }

        button:hover {
            background-color: #43a047;
        }
    </style>
</head>
<body>

<h1>2┆🔵・𝘈𝘭𝘭𝘦𝘳 𝘴𝘢𝘯𝘴 𝘳𝘦𝘵𝘰𝘶𝘳</h1>

<img id="episodeImage" src="../Saison 1/Épisode 2/1.png" alt="Page 1">

<div class="buttons">
    <button onclick="prevImage()">⬅ Précédent</button>
    <button onclick="nextImage()">Suivant ➡</button>
</div>

<script>
    const images = [];
    for (let i = 1; i <= 147; i++) {
        images.push(`../Saison 1/Épisode 2/${i}.png`);
    }

    let index = 0;

    function showImage() {
        document.getElementById("episodeImage").src = images[index];
        document.getElementById("episodeImage").alt = "Page " + (index + 1);
    }

    function nextImage() {
        if (index < images.length - 1) {
            index++;
            showImage();
        }
    }

    function prevImage() {
        if (index > 0) {
            index--;
            showImage();
        }
    }
</script>

</body>
</html>
